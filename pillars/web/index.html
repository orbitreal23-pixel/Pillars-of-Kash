<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pillars of Kash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b3b2c%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23e6c872%27%3EP%3C/text%3E%3C/svg%3E"><style>:root{--g:#0b3b2c;--g2:#14664a;--gold:#c8a24a;--bg:#f3f5f0;--tx:#13211a;--mu:#6a7a71;--bd:#e4e8e0;--sh:0 1px 2px rgba(16,40,28,.05),0 8px 24px rgba(16,40,28,.06)}
*{box-sizing:border-box}body{font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#072a20,var(--g) 55%,#10573f);color:#fff;padding:0 22px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(7,42,32,.25);min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#e6c872,var(--gold));color:#2b2108;display:grid;place-items:center;font-weight:800}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
header nav button{background:none;border:0;color:#cfe5da;padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit;font-weight:500;white-space:nowrap;transition:.15s}
header nav button:hover{background:rgba(255,255,255,.09);color:#fff}header nav button.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
.who{display:flex;flex-direction:column;text-align:right;line-height:1.2;white-space:nowrap}.who small{color:#e6c872;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
header .out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 13px;border-radius:9px;cursor:pointer;font:inherit}header .out:hover{background:rgba(255,255,255,.2)}
main{max-width:1040px;margin:26px auto;padding:0 16px}
.c{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--sh);overflow-x:auto}
.c h2{margin:0 0 6px;font-size:22px;letter-spacing:-.3px}.mut{color:var(--mu)}
.kpi{flex:1;min-width:150px;padding:14px 16px;background:linear-gradient(#fff,#f6f9f4);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:12px}
.kpi small{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.kpi b{font-size:22px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;margin-top:8px}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid #eef1ea;font-variant-numeric:tabular-nums}tr:hover td{background:#fafcf8}tr:last-child td{border-bottom:0}
a{color:var(--g2);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
input,select{padding:10px 12px;margin:4px 4px 4px 0;font:inherit;border:1px solid #d5dcd2;border-radius:10px;background:#fff;color:var(--tx);transition:.15s;max-width:100%}
input:focus,select:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px rgba(20,102,74,.15)}
button.b{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border:0;padding:10px 16px;margin:4px 4px 4px 0;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 2px 8px rgba(11,59,44,.25);transition:.15s}
button.b:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(11,59,44,.3)}
.s{background:#eef2ea!important;color:var(--tx)!important;box-shadow:none!important;border:1px solid var(--bd)!important}
.dg{background:#fdecec!important;color:#b42318!important;border:1px solid #f6caca!important}
.err{color:#b42318}small.err{background:#fde8e8;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.bd{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600}.ok{background:#e1f4e8;color:#13693a}.wn{background:#fdf1d6;color:#8a5a00}.no{background:#fde8e8;color:#b42318}.mu{background:#edf0ea;color:#55645b}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% 10%,#14664a 0,transparent 60%),radial-gradient(700px 500px at 90% 90%,#7a6120 0,transparent 55%),#072a20}
.authcard{background:#fff;border-radius:22px;padding:34px 30px;width:100%;max-width:390px;box-shadow:0 30px 70px rgba(0,0,0,.35);text-align:center}
.authcard .logo{margin:0 auto 12px;width:52px;height:52px;border-radius:16px;font-size:24px}.authcard h1{margin:0;font-size:24px;letter-spacing:-.4px}.authcard p.sub{margin:4px 0 20px;color:var(--mu)}
.authcard input{width:100%;margin:5px 0;padding:13px 14px;font-size:16px}.authcard button.b{width:100%;margin:10px 0 0;padding:13px;font-size:16px}.authcard .err{margin:12px 0 0;min-height:20px}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.av{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,var(--g2),var(--g));color:#e6c872;display:grid;place-items:center;font-size:23px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 16px rgba(11,59,44,.25)}.pn{flex:1;min-width:180px}.pn h2{margin:0;font-size:24px}.pn .sub{color:var(--mu);margin-top:3px}.pn .sub b{color:var(--g2);font-variant-numeric:tabular-nums}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:18px 0 4px}.det div{background:#fff;padding:12px 14px}.det small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}.det span{font-weight:600}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.ovl{position:fixed;inset:0;background:rgba(7,28,21,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;padding:16px}.mdl{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:440px;box-shadow:0 30px 70px rgba(0,0,0,.35);max-height:92vh;overflow:auto}.mdl h2{margin:0}.mdl label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-top:12px}.mdl input,.mdl select{width:100%;margin:4px 0 0;font-size:15px;color:var(--tx);text-transform:none;letter-spacing:0}
.kpi.red{border-top-color:#d92d20;background:linear-gradient(#fff,#fff3f1)}.kpi.red b{color:#b42318}tr.arR td:first-child{box-shadow:inset 3px 0 0 #d92d20}tr.arA td:first-child{box-shadow:inset 3px 0 0 #f59e0b}tr.rR td:nth-child(n+3){color:#b42318;font-weight:600}tr.rA td:nth-child(n+3){color:#b45309;font-weight:600}td.err,td.amb{font-weight:600}td.amb{color:#b45309}small.amb{background:#fdf0dc;color:#b45309;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.kpi.amb{border-top-color:#f59e0b;background:linear-gradient(#fff,#fffaf0)}.kpi.amb b{color:#b45309}
.ov{position:fixed;inset:0;background:rgba(7,42,32,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}.mb{background:#fff;border-radius:18px;padding:24px;max-width:640px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.35)}.mb h2{margin:0 0 14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.fg label{display:block;font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.4px}.fg input,.fg select{width:100%;margin:4px 0 0;font-weight:400;font-size:14.5px;text-transform:none}
@media print{header,.acts,body::after{display:none!important}.c{box-shadow:none}body{background:#fff}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-bottom:18px}.two .c{margin:0}
.ins{list-style:none;padding:0;margin:8px 0 0}.ins li{padding:10px 0 10px 24px;border-bottom:1px solid #eef1ea;position:relative}.ins li:last-child{border:0}.ins li:before{content:'';position:absolute;left:3px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--g2)}.ins li.w:before{background:#f59e0b}.ins li.r:before{background:#d92d20}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;margin-top:12px}.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px}.bar i{display:block;width:100%;max-width:60px;background:linear-gradient(var(--g2),var(--g));border-radius:8px 8px 0 0;min-height:3px}.bar b{margin-bottom:4px}.bar small{color:var(--mu);margin-top:6px;white-space:nowrap}
.stp{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.stp i{font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:99px;background:#edf0ea;color:#6a7a71}.stp i.d{background:#e1f4e8;color:#13693a}.stp i.n{background:#fdf1d6;color:#8a5a00;font-weight:700}
a.nm{color:var(--tx);font-weight:600;border-bottom:1px dotted #9db0a5}a.nm:hover{color:var(--g2);border-bottom-color:var(--g2);text-decoration:none}
.bell{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}.bell:hover{background:rgba(255,255,255,.2)}.bc{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:99px;background:#d92d20;color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}.cal .mo{border:1px solid var(--bd);border-radius:12px;padding:12px;background:#fafcf8}.cal .mo.cur{border-color:var(--gold);background:#fffaf0}.cal h4{margin:0 0 8px}.cal .b1{padding:3px 6px}.cal .b1 b{display:inline-block;width:26px;color:var(--g2)}.cal .b1.t{background:#fdf1d6;border-radius:6px}
.sb{height:8px;background:#eef1ea;border-radius:99px}.sb i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--gold));border-radius:99px}
body::after{content:'v14';position:fixed;right:8px;bottom:6px;font-size:10px;color:#9aa8a0}@media(max-width:760px){header{flex-wrap:wrap;padding:10px 14px;gap:8px}nav{order:3;flex-basis:100%}.who{margin-left:auto}main{margin:16px auto}.c{padding:14px;border-radius:14px}}

<body><div id="root"></div><script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=p=>'256'+p.replace(/\D/g,'').replace(/^(256|0)/,''),fm=n=>'USh '+Number(n).toLocaleString();
const RL={admin:'Super Admin',chairman:'Chairman',treasurer:'Treasurer',secretary:'Secretary',auditor:'Auditor',member:'Member'};
let me,tab='members';
const can=(...r)=>r.includes(me.role)||(me.role=='chairman'&&r.includes('admin')),fail=e=>alert(e.message||e.error||e);
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data,error}=await sb.from('staff').select('name,role,member_id').eq('user_id',session.user.id).single();if(error){await sb.auth.signOut();return login('No portal access for this account')}me=data;tab=me.role=='member'?'me':'ov';idleReset();show()}
function login(msg=''){try{if(localStorage.getItem('idle')){msg='You were signed out after 10 minutes of inactivity.';localStorage.removeItem('idle')}}catch(e){}$('root').innerHTML=`<div class="auth"><div class="authcard"><div class="logo">P</div><h1>Pillars of Kash</h1><p class="sub">Member portal · sign in</p><input id="ph" placeholder="Phone number" inputmode="tel" autocomplete="username"><input id="pin" type="password" placeholder="6-digit PIN" inputmode="numeric" maxlength="6" autocomplete="current-password" onkeydown="event.key=='Enter'&&go()"><button class="b" onclick="go()">Sign in</button><p class="err">${msg}</p></div></div>`}
async function go(){const{error}=await sb.auth.signInWithPassword({email:norm($('ph').value)+'@pillars.local',password:$('pin').value});error?login(error.message):boot()}
const tabs=()=>me.role=='member'?[['me','My account'],['loans','Loans']]:[['ov','Overview'],['members','Members'],...(can('admin','treasurer','auditor')?[['pay','General ledger']]:[]),...(can('secretary')?[]:[['loans','Loans']]),...(can('admin','treasurer','auditor')?[['accs','Accounts'],['exps','Expenses']]:[]),['bday','Birthdays'],...(can('admin','treasurer')?[['appr','Approvals']]:[]),...(can('admin','treasurer','auditor')?[['reps','Reports']]:[]),...(me.role=='admin'?[['users','Users & roles']]:[]),...(['admin','auditor'].includes(me.role)?[['audit','Audit log']]:[])];
async function show(){$('root').innerHTML=`<header><div class="brand"><span class="logo">P</span><span>Pillars of Kash</span></div><nav>${tabs().map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';show()">${t[1]}</button>`).join('')}</nav><button class="bell" onclick="bellOpen()" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><span id="bc" class="bc"></span></button><div class="who"><b>${esc(me.name)}</b><small>${RL[me.role]}</small></div><button class="out" onclick="out()">Sign out</button></header><main id="pg">Loading…</main>`;await({ov,loan:()=>loanP(LID),me:()=>prof(me.member_id),prof:()=>prof(PID),members:mem,loans:lns,pay,appr,reps,users:usr,audit:aud,accs,exps,bday}[tab])();notifRefresh()}
let MEM=[];async function mem(){const{data}=await sb.from('members').select('*').order('seq');MEM=data;
 $('pg').innerHTML=(can('admin','secretary')?`<div class="c"><b>Add member</b> <span class="mut">New members start owing contributions from August 2026 and must clear that arrears.</span><br><input id="n" placeholder="Full name"><input id="p" placeholder="Phone"><input id="nin" placeholder="NIN"><input id="dob" type="date"><select id="g"><option>Female</option><option>Male</option></select><button class="b" onclick="addM()">Save</button></div>`:'')+`<div class="c"><table><tr><th>Account</th><th>Name</th><th>Phone</th><th>Status</th></tr>${data.map(m=>`<tr><td>${m.acct}</td><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${m.status}</td><td>${can('admin','secretary')?`<a href="#" onclick="ed('${m.id}');return false">Edit</a>`:''}</td></tr>`).join('')}</table></div>`}
async function addM(){const{error}=await sb.rpc('add_member',{n:$('n').value,p:$('p').value.trim()?norm($('p').value):null,nin:$('nin').value||null,dob:$('dob').value||null,g:$('g').value});error?fail(error):show()}
async function pay(){const[{data:e},{data:m}]=await Promise.all([sb.from('entries').select('*,members(name,acct)').order('id',{ascending:false}),sb.from('members').select('id,acct,name').eq('status','Active').order('seq')]);
 $('pg').innerHTML=(can('admin','treasurer')?`<div class="c"><b>Record payment</b><br><select id="pm">${m.map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('')}</select><input id="mo" type="month"><input id="am" type="number" value="5000"><select id="me"><option>Mobile Money</option><option>Cash</option><option>Bank</option></select><input id="tx" placeholder="Transaction ID / reference"><button class="b" onclick="recP()">Submit for approval</button></div>`:'')+`<div class="c"><table><tr><th>Receipt</th><th>Account</th><th>Month paid for</th><th>Txn ref</th><th>Amount</th><th>Status</th><th></th></tr>${e.map(x=>`<tr><td>${x.receipt||'—'}</td><td>${x.members.acct} <a class="nm" href="#" onclick="openM('${x.member_id}');return false">${esc(x.members.name)}</a></td><td>${x.month?mfmt(x.month):''}</td><td>${esc(x.txn_ref||'—')}</td><td>${fm(x.amt)}</td><td>${x.status}</td><td>${x.status=='pend'&&can('admin','treasurer')?`<button class="b" onclick="dec(${x.id},true)">Approve</button><button class="b s" onclick="dec(${x.id},false)">Reject</button>`:''}</td></tr>`).join('')}</table></div>`}
async function recP(){const{error}=await sb.rpc('record_payment',{mid:$('pm').value,mon:$('mo').value,a:+$('am').value,meth:$('me').value,txn:$('tx').value||null});error?fail(error):show()}
async function dec(id,ok){const{error}=await sb.rpc('decide_entry',{eid:id,ok});error?fail(error):show()}
const fn=async b=>{await sb.auth.refreshSession();const{data,error}=await sb.functions.invoke('admin-users-',{body:b});let m=(data&&data.error)||'';if(error&&!m){try{m=(await error.context.json()).error}catch(e){m=error.message}}if(error||m)fail(m||'Failed');else show()};
async function usr(){const[{data:u},{data:m}]=await Promise.all([sb.from('staff').select('*,members(acct)'),sb.from('members').select('id,acct,name').eq('status','Active').order('seq')]);const free=m.filter(x=>!u.some(s=>s.member_id==x.id));FREE=free;
 $('pg').innerHTML=`<div class="c"><b>Give access</b><br><input id="uf" placeholder="Search member…" oninput="fltU(this.value)"><select id="um">${free.map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('')}</select><select id="ur">${Object.entries(RL).map(r=>`<option value="${r[0]}" ${r[0]=='member'?'selected':''}>${r[1]}</option>`).join('')}</select><input id="up" placeholder="6-digit PIN" maxlength="6" inputmode="numeric"><button class="b" onclick="fn({action:'create',member_id:$('um').value,role:$('ur').value,pin:$('up').value})">Create login</button></div><div class="c"><input placeholder="Search users by name, account or role…" style="width:100%" oninput="rowF(this)"><table><tr><th>Name</th><th>Role</th><th></th></tr>${u.map(s=>`<tr><td>${esc(s.name)} ${s.members?.acct||''}</td><td><select onchange="fn({action:'role',user_id:'${s.user_id}',role:this.value})">${Object.entries(RL).map(r=>`<option value="${r[0]}" ${r[0]==s.role?'selected':''}>${r[1]}</option>`).join('')}</select></td><td><button class="b s" onclick="p=prompt('New 6-digit PIN');p&&fn({action:'reset',user_id:'${s.user_id}',pin:p})">Reset PIN</button><button class="b s" onclick="confirm('Remove access?')&&fn({action:'remove',user_id:'${s.user_id}'})">Remove</button></td></tr>`).join('')}</table></div>`}
async function aud(){const{data}=await sb.from('audit').select('*').order('id',{ascending:false}).limit(200);$('pg').innerHTML=`<div class="c"><table>${data.map(a=>`<tr><td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.who)}</td><td>${esc(a.action)}</td></tr>`).join('')}</table></div>`}
const rpc=async(f,a)=>{const{error}=await sb.rpc(f,a);error?fail(error):show()};
async function ed(id){const m=MEM.find(x=>x.id==id),n=prompt('Full name',m.name);if(n===null)return;const p=prompt('Phone number (needed for login)',m.phone||'');if(p===null)return;rpc('edit_member',{mid:id,n,p:p.trim()?norm(p):null})}
const bl=l=>{let d=0,i=0,r=0;(l.loan_entries||[]).forEach(e=>e.k=='disb'?d+=e.amt:e.k=='int'?i+=e.amt:r+=e.amt);return d+i-r};
const LS={gua:'Awaiting guarantors',tre:'Awaiting Treasurer',pend:'Awaiting Chairman',ok:'Active',rej:'Rejected'};let LC=[];
const opt=(D)=>'<option value="">Guarantor…</option>'+D.filter(x=>x.id!=me.member_id).map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('');

async function saveRev(id,fn){const{error}=await sb.rpc(fn,{eid:id,why:$('v_r').value.trim()});if(error)return fail(error);cl();show()}

const ACC=['Cash','Mobile Money','Bank'],CATS=['Legal','Stationery','Operations','Facilitation','Transport','Meetings & refreshments','Communication','Welfare & events','Bank & mobile charges','Other'];
const txF=(p,al)=>`<label>${al}<select id="${p}_ac" onchange="txUp('${p}')">${ACC.map(a=>`<option>${a}</option>`).join('')}</select></label><label>Amount (USh)<input id="${p}_a" type="number" oninput="txUp('${p}')"></label><label class="${p}_nc">Transaction charge (USh)<input id="${p}_c" type="number" value="0" oninput="txUp('${p}')"></label><label class="${p}_nc">Transaction ID / reference<input id="${p}_x"></label><label>Total (amount + charge)<input id="${p}_t" disabled></label>`;
function txUp(p){const cash=$(p+'_ac').value=='Cash';document.querySelectorAll('.'+p+'_nc').forEach(e=>e.style.display=cash?'none':'');$(p+'_t').value='USh '+((+$(p+'_a').value||0)+(cash?0:+$(p+'_c').value||0)).toLocaleString()}
const txV=p=>{const cash=$(p+'_ac').value=='Cash';return{ac:$(p+'_ac').value,a:+$(p+'_a').value,c:cash?0:+$(p+'_c').value||0,x:$(p+'_x').value.trim()||null}};
const acts=(f,t)=>`<div class="acts"><button class="b" onclick="${f}">${t}</button><button class="b s" onclick="cl()">Cancel</button></div>`;
function wdP(id){mdl(`<h2>Withdraw savings</h2><p class="mut" style="margin:0 0 12px">On Mobile Money and Bank payouts the charge is deducted from the member's savings together with the amount. The Admin approves.</p><div class="fg">${txF('w','Pay out from')}<label style="grid-column:1/-1">Reason (required)<input id="w_r"></label></div>${acts(`saveWd('${id}')`,'Submit for approval')}`);txUp('w')}
async function saveWd(id){const v=txV('w'),{error}=await sb.rpc('request_withdrawal',{mid:id,a:v.a,meth:v.ac,why:$('w_r').value.trim(),chg:v.c,txn:v.x});if(error)return fail(error);cl();show()}
function gwdP(){mdl(`<h2>General withdrawal</h2><p class="mut" style="margin:0 0 12px">Money taken out of the group's funds. The Admin approves.</p><div class="fg">${txF('g','Pay out from')}<label style="grid-column:1/-1">Reason (required)<input id="g_r"></label></div>${acts('saveG()','Submit for approval')}`);txUp('g')}
async function saveG(){const v=txV('g'),{error}=await sb.rpc('request_group_withdrawal',{a:v.a,meth:v.ac,why:$('g_r').value.trim(),chg:v.c,txn:v.x});if(error)return fail(error);cl();show()}
function expP(){mdl(`<h2>Record expense</h2><div class="fg"><label>Category<select id="e_k">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Date<input id="e_d" type="date" value="${new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"></label><label style="grid-column:1/-1">Description<input id="e_n" placeholder="What was it for?"></label>${txF('e','Paid from')}</div>${acts('saveE()','Submit for approval')}`);txUp('e')}
async function saveE(){const v=txV('e'),{error}=await sb.rpc('request_expense',{cat:$('e_k').value,d:$('e_n').value.trim(),a:v.a,ac:v.ac,chg:v.c,txn:v.x,dt:$('e_d').value});if(error)return fail(error);cl();show()}
function movP(){const o=a=>ACC.map(x=>`<option ${x==a?'selected':''}>${x}</option>`).join('');mdl(`<h2>Transfer between accounts</h2><p class="mut" style="margin:0 0 12px">For example: withdraw from Bank to Cash, or deposit Cash into Bank. The Admin approves.</p><div class="fg"><label>From<select id="m_f" onchange="mvUp()">${o('Bank')}</select></label><label>To<select id="m_t">${o('Cash')}</select></label><label>Amount (USh)<input id="m_a" type="number" oninput="mvUp()"></label><label class="m_nc">Transaction charge (USh)<input id="m_c" type="number" value="0" oninput="mvUp()"></label><label>Transaction ID / reference<input id="m_x"></label><label>Total leaving the account<input id="m_tt" disabled></label><label style="grid-column:1/-1">Note<input id="m_n" placeholder="e.g. Cash withdrawn for facilitation"></label></div>${acts('saveMv()','Submit for approval')}`);mvUp()}
function mvUp(){const cash=$('m_f').value=='Cash';document.querySelectorAll('.m_nc').forEach(e=>e.style.display=cash?'none':'');$('m_tt').value='USh '+((+$('m_a').value||0)+(cash?0:+$('m_c').value||0)).toLocaleString()}
async function saveMv(){const cash=$('m_f').value=='Cash',{error}=await sb.rpc('request_move',{fa:$('m_f').value,ta:$('m_t').value,a:+$('m_a').value,chg:cash?0:+$('m_c').value||0,nt:$('m_n').value.trim()||null,txn:$('m_x').value.trim()||null});if(error)return fail(error);cl();show()}
function preL(id){mdl(`<h2>Pre-approve loan</h2><p class="mut" style="margin:0 0 12px">Choose the account the loan will be paid from. The Chairman then gives final approval.</p><div class="fg"><label>Pay out from<select id="pa">${ACC.map(a=>`<option>${a}</option>`).join('')}</select></label></div>${acts(`savePre(${id})`,'Pre-approve')}`)}
async function savePre(id){const{error}=await sb.rpc('advance_loan',{lid:id,ok:true,ac:$('pa').value});if(error)return fail(error);cl();show()}
async function accs(){const[{data:B},{data:MV}]=await Promise.all([sb.rpc('account_balances'),sb.from('account_moves').select('*').order('id',{ascending:false}).limit(50)]);
 $('pg').innerHTML=`<div class="c" style="display:flex;gap:10px;flex-wrap:wrap">${(B||[]).map(x=>st(x.acct,fm(x.bal),x.bal<0?'red':'')).join('')}${st('Total funds',fm((B||[]).reduce((a,x)=>a+x.bal,0)))}</div><div class="c">${can('treasurer')?`<button class="b" onclick="movP()">Transfer between accounts</button><button class="b" onclick="gwdP()">General withdrawal</button><button class="b" onclick="expP()">Record expense</button>`:''}<p class="mut">Transfers, withdrawals and expenses are approved by the Admin. Mobile Money and Bank transactions carry a transaction charge, included in the total.</p><table><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Charge</th><th>Status</th></tr>${(MV||[]).map(x=>`<tr><td>${fd(x.paid_on)}</td><td>${x.from_acct}</td><td>${x.to_acct}</td><td>${fm(x.amt)}</td><td>${fm(x.charge)}</td><td>${x.status}</td></tr>`).join('')||'<tr><td>No transfers yet</td></tr>'}</table></div>`}
async function exps(){const{data:X}=await sb.from('expenses').select('*').order('id',{ascending:false}),cat={};X.filter(x=>x.status=='ok').forEach(x=>cat[x.category]=(cat[x.category]||0)+x.amt+x.charge);const T=Object.values(cat).reduce((a,b)=>a+b,0)||1;
 $('pg').innerHTML=`<div class="c">${can('treasurer')?`<button class="b" style="float:right" onclick="expP()">Record expense</button>`:''}<b>Spending by category</b> <span class="mut">(approved expenses)</span><table>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fm(v)}</td><td style="width:40%"><div class="sb"><i style="width:${Math.round(v*100/T)}%"></i></div></td><td>${Math.round(v*100/T)}%</td></tr>`).join('')||'<tr><td>No approved expenses yet</td></tr>'}</table></div><div class="c"><b>Expense register</b><table><tr><th>Date</th><th>Voucher</th><th>Category</th><th>Description</th><th>Account</th><th>Total</th><th>Status</th></tr>${X.map(x=>`<tr><td>${fd(x.paid_on)}</td><td>${x.voucher||'—'}</td><td>${esc(x.category)}</td><td>${esc(x.descr)}${x.charge?'<br><small>incl. '+fm(x.charge)+' charge</small>':''}</td><td>${x.acct}</td><td>${fm(x.amt+x.charge)}</td><td>${x.status}</td></tr>`).join('')||'<tr><td>No expenses yet</td></tr>'}</table></div>`}
const nb=(dob,now)=>{const[y,mo,d]=dob.split('-').map(Number);let n=new Date(now.getFullYear(),mo-1,d);if(n<now)n=new Date(now.getFullYear()+1,mo-1,d);return{mo:mo-1,d,n,days:Math.round((n-now)/864e5),age:n.getFullYear()-y}};
async function bday(){const{data:M}=await sb.from('members').select('id,name,acct,dob').eq('status','Active'),now=new Date();now.setHours(0,0,0,0);const L=(M||[]).filter(m=>m.dob).map(m=>({...m,...nb(m.dob,now)})).sort((a,b)=>a.n-b.n),up=L.filter(x=>x.days<=60),mn=['January','February','March','April','May','June','July','August','September','October','November','December'],lk=m=>`<a class="nm" href="#" onclick="openM('${m.id}');return false">${esc(m.name)}</a>`;
 $('pg').innerHTML=`<div class="c"><h2>Upcoming birthdays</h2><p class="mut" style="margin:0 0 6px">Members to celebrate in the next 60 days.</p><table>${up.map(x=>`<tr><td><b>${x.d} ${mn[x.mo].slice(0,3)}</b></td><td>${lk(x)}</td><td>turning ${x.age}</td><td>${x.days==0?'<span class="bd wn">Today</span>':x.days==1?'Tomorrow':'in '+x.days+' days'}</td></tr>`).join('')||'<tr><td>No birthdays in the next 60 days</td></tr>'}</table></div><div class="c"><b>Birthday calendar</b><div class="cal">${mn.map((n,i)=>`<div class="mo ${i==now.getMonth()?'cur':''}"><h4>${n}</h4>${L.filter(x=>x.mo==i).sort((a,b)=>a.d-b.d).map(x=>`<div class="b1 ${x.days==0?'t':''}"><b>${x.d}</b> ${lk(x)}</div>`).join('')||'<small class="mut">No birthdays</small>'}</div>`).join('')}</div></div>${(M||[]).length-L.length?`<p class="mut">${(M||[]).length-L.length} members have no date of birth recorded. Add it under their profile (Edit).</p>`:''}`}
let NS=[];
async function notif(){const N=[],c=async(t,f)=>(await sb.from(t).select('id',{count:'exact',head:true}).match(f)).count||0,now=new Date();now.setHours(0,0,0,0);const today=new Date().toISOString().slice(0,10),mine=me.member_id;
 if(can('admin','treasurer')){const q=await Promise.all([c('entries',{status:'pend'}),c('gwds',{status:'pend'}),c('expenses',{status:'pend'}),c('account_moves',{status:'pend'}),c('loan_rev_req',{status:'pend'})]),t=q.reduce((a,b)=>a+b,0);if(t)N.push(['w',`${t} item${t>1?'s':''} awaiting approval`,'appr'])}
 if(me.role!='secretary'){const{data:L}=await sb.from('loans').select('status,term,approved_on,loan_entries(k,amt),loan_guarantors(member_id,s)'),g=(L||[]).filter(l=>l.status=='gua'&&l.loan_guarantors.some(x=>x.member_id==mine&&x.s=='wait')).length,tr=(L||[]).filter(l=>l.status=='tre').length,pe=(L||[]).filter(l=>l.status=='pend').length,ov=(L||[]).filter(l=>{if(l.status!='ok')return false;const f=k=>l.loan_entries.filter(e=>e.k==k).reduce((s,e)=>s+e.amt,0);return f('disb')+f('int')-f('rep')>0&&addMo(l.approved_on,l.term)<today}).length;
  if(g)N.push(['r',`${g} guarantee request${g>1?'s':''} waiting for your reply`,'loans']);if(tr&&can('treasurer'))N.push(['w',`${tr} loan${tr>1?'s':''} awaiting your pre-approval`,'loans']);if(pe&&can('admin'))N.push(['w',`${pe} loan${pe>1?'s':''} awaiting final approval`,'loans']);if(ov&&can('admin','treasurer','auditor'))N.push(['r',`${ov} overdue loan${ov>1?'s':''}`,'loans'])}
 const{data:S}=await sb.from('member_summary').select('id,arrears,status');if(me.role=='member'){const m=(S||[]).find(x=>x.id==mine);if(m&&m.arrears>0)N.push([m.arrears>=15000?'r':'w',`Your contributions are ${Math.round(m.arrears/5000)} month${m.arrears>5000?'s':''} behind (${fm(m.arrears)})`,'me'])}else{const k=(S||[]).filter(x=>x.arrears>=15000).length;if(k)N.push(['r',`${k} member${k>1?'s are':' is'} 3+ months in arrears`,'ov']);
  const{data:M}=await sb.from('members').select('dob').eq('status','Active'),b=(M||[]).filter(m=>m.dob).map(m=>nb(m.dob,now).days),b0=b.filter(d=>d==0).length,b7=b.filter(d=>d>0&&d<=7).length;if(b0)N.push(['',`${b0} birthday${b0>1?'s':''} today`,'bday']);if(b7)N.push(['',`${b7} birthday${b7>1?'s':''} in the next 7 days`,'bday'])}
 return N}
async function notifRefresh(){try{NS=await notif();const b=$('bc');if(b){b.textContent=NS.length;b.style.display=NS.length?'grid':'none'}}catch(e){}}
function bellOpen(){mdl(`<h2>Notifications</h2><ul class="ins">${NS.map(n=>`<li class="${n[0]}"><a href="#" onclick="cl();tab='${n[2]}';show();return false">${n[1]}</a></li>`).join('')||'<li>You are all caught up.</li>'}</ul>${acts('cl()','Close').replace('<button class="b s" onclick="cl()">Cancel</button>','')}`)}
setInterval(()=>{if(me&&$('bc'))notifRefresh()},120000);
let idleT;function idleReset(){clearTimeout(idleT);if(me)idleT=setTimeout(()=>{try{localStorage.setItem('idle','1')}catch(e){}out()},600000)}
['mousemove','keydown','click','touchstart','scroll'].forEach(ev=>addEventListener(ev,idleReset,{passive:true}));
const BG={ok:['Approved','ok'],pend:['Pending','wn'],rej:['Rejected','no'],Active:['Active','ok'],Inactive:['Inactive','mu'],Cleared:['Cleared','ok'],Overdue:['Overdue','no'],'Awaiting guarantors':['Awaiting guarantors','wn'],'Awaiting Treasurer':['Awaiting Treasurer','wn'],'Awaiting Chairman':['Awaiting Chairman','wn'],Rejected:['Rejected','no']};
function polish(){document.querySelectorAll('td').forEach(td=>{if(td.children.length)return;const t=td.textContent.trim(),m=BG[t];if(m)td.innerHTML='<span class="bd '+m[1]+'">'+m[0]+'</span>'});document.querySelectorAll('button.s').forEach(b=>{if(/^(Reject|Decline|Delete|Remove)/.test(b.textContent.trim()))b.classList.add('dg')})}
new MutationObserver(polish).observe(document.getElementById('root'),{childList:true,subtree:true});
boot();
</script></body></html>
