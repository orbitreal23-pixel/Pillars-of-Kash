<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pillars of Kash</title>
<style>body{font:15px system-ui;margin:0;background:#f6f7f5;color:#1c2a22}header{background:#14532d;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header button{background:none;border:0;color:#d1fae5;cursor:pointer;font:inherit}header button.on{color:#fff;font-weight:700}main{max-width:960px;margin:18px auto;padding:0 14px}.c{background:#fff;border-radius:10px;padding:16px;margin-bottom:14px;overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid #e5e7e0}input,select,button.b{padding:8px;margin:3px;font:inherit}button.b{background:#14532d;color:#fff;border:0;border-radius:6px;cursor:pointer}.s{background:#e5e7e0!important;color:#1c2a22!important}.err{color:#b91c1c}</style></head>
<body><div id="root"></div><script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=p=>'256'+p.replace(/\D/g,'').replace(/^(256|0)/,''),fm=n=>'USh '+Number(n).toLocaleString();
const RL={admin:'Super Admin',treasurer:'Treasurer',secretary:'Secretary',auditor:'Auditor',member:'Member'};
let me,tab='members';
const can=(...r)=>r.includes(me.role),fail=e=>alert(e.message||e.error||e);
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data,error}=await sb.from('staff').select('name,role,member_id').single();if(error){await sb.auth.signOut();return login('No portal access for this account')}me=data;tab=me.role=='member'?'me':'ov';show()}
function login(msg=''){$('root').innerHTML=`<main style="max-width:360px"><div class="c"><h2>Pillars of Kash</h2><input id="ph" placeholder="Phone number" inputmode="tel" style="width:92%"><input id="pin" type="password" placeholder="6-digit PIN" inputmode="numeric" maxlength="6" style="width:92%"><button class="b" onclick="go()">Sign in</button><p class="err">${msg}</p></div></main>`}
async function go(){const{error}=await sb.auth.signInWithPassword({email:norm($('ph').value)+'@pillars.local',password:$('pin').value});error?login('Wrong phone number or PIN'):boot()}
const tabs=()=>me.role=='member'?[['me','My account'],['loans','Loans']]:[['ov','Overview'],['members','Members'],...(can('admin','treasurer','auditor')?[['pay','General ledger']]:[]),...(can('secretary')?[]:[['loans','Loans']]),...(can('admin','treasurer')?[['appr','Approvals']]:[]),...(can('admin','treasurer','auditor')?[['reps','Reports']]:[]),...(can('admin')?[['users','Users & roles']]:[]),...(can('admin','auditor')?[['audit','Audit log']]:[])];
async function show(){$('root').innerHTML=`<header><b>Pillars of Kash</b>${tabs().map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';show()">${t[1]}</button>`).join('')}<span style="margin-left:auto">${esc(me.name)} · ${RL[me.role]}</span><button onclick="sb.auth.signOut().then(boot)">Sign out</button></header><main id="pg">Loading…</main>`;await({ov,me:()=>prof(me.member_id),prof:()=>prof(PID),members:mem,loans:lns,pay,appr,reps,users:usr,audit:aud}[tab])()}
let MEM=[];async function mem(){const{data}=await sb.from('members').select('*').order('seq');MEM=data;
 $('pg').innerHTML=(can('admin','secretary')?`<div class="c"><b>Add member</b><br><input id="n" placeholder="Full name"><input id="p" placeholder="Phone"><input id="nin" placeholder="NIN"><input id="dob" type="date"><select id="g"><option>Female</option><option>Male</option></select><button class="b" onclick="addM()">Save</button></div>`:'')+`<div class="c"><table><tr><th>Account</th><th>Name</th><th>Phone</th><th>Status</th><th></th></tr>${data.map(m=>`<tr><td>${m.acct}</td><td>${esc(m.name)}</td><td>${esc(m.phone)}</td><td>${m.status}</td><td>${can('admin','secretary')?`<a href="#" onclick="ed('${m.id}');return false">Edit</a>`:''}</td></tr>`).join('')}</table></div>`}
async function addM(){const{error}=await sb.rpc('add_member',{n:$('n').value,p:$('p').value.trim()?norm($('p').value):null,nin:$('nin').value||null,dob:$('dob').value||null,g:$('g').value});error?fail(error):show()}
async function pay(){const[{data:e},{data:m}]=await Promise.all([sb.from('entries').select('*,members(name,acct)').order('id',{ascending:false}),sb.from('members').select('id,acct,name').eq('status','Active').order('seq')]);
 $('pg').innerHTML=(can('admin','treasurer')?`<div class="c"><b>Record payment</b><br><select id="pm">${m.map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('')}</select><input id="mo" type="month"><input id="am" type="number" value="5000"><select id="me"><option>Mobile Money</option><option>Cash</option><option>Bank</option></select><button class="b" onclick="recP()">Submit for approval</button></div>`:'')+`<div class="c"><table><tr><th>Receipt</th><th>Account</th><th>Month</th><th>Amount</th><th>Status</th><th></th></tr>${e.map(x=>`<tr><td>${x.receipt||'—'}</td><td>${x.members.acct} ${esc(x.members.name)}</td><td>${x.month||''}</td><td>${fm(x.amt)}</td><td>${x.status}</td><td>${x.status=='pend'&&can('admin','treasurer')?`<button class="b" onclick="dec(${x.id},true)">Approve</button><button class="b s" onclick="dec(${x.id},false)">Reject</button>`:''}</td></tr>`).join('')}</table></div>`}
async function recP(){const{error}=await sb.rpc('record_payment',{mid:$('pm').value,mon:$('mo').value,a:+$('am').value,meth:$('me').value});error?fail(error):show()}
async function dec(id,ok){const{error}=await sb.rpc('decide_entry',{eid:id,ok});error?fail(error):show()}
const fn=async b=>{const{data,error}=await sb.functions.invoke('admin-users',{body:b});const d=data||{};if(error||d.error)fail(d.error||'Failed');else show()};
async function usr(){const[{data:u},{data:m}]=await Promise.all([sb.from('staff').select('*,members(acct)'),sb.from('members').select('id,acct,name').eq('status','Active').order('seq')]);const free=m.filter(x=>!u.some(s=>s.member_id==x.id));
 $('pg').innerHTML=`<div class="c"><b>Give access</b><br><select id="um">${free.map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('')}</select><select id="ur">${Object.entries(RL).map(r=>`<option value="${r[0]}" ${r[0]=='member'?'selected':''}>${r[1]}</option>`).join('')}</select><input id="up" placeholder="6-digit PIN" maxlength="6" inputmode="numeric"><button class="b" onclick="fn({action:'create',member_id:$('um').value,role:$('ur').value,pin:$('up').value})">Create login</button></div><div class="c"><table><tr><th>Name</th><th>Role</th><th></th></tr>${u.map(s=>`<tr><td>${esc(s.name)} ${s.members?.acct||''}</td><td><select onchange="fn({action:'role',user_id:'${s.user_id}',role:this.value})">${Object.entries(RL).map(r=>`<option value="${r[0]}" ${r[0]==s.role?'selected':''}>${r[1]}</option>`).join('')}</select></td><td><button class="b s" onclick="p=prompt('New 6-digit PIN');p&&fn({action:'reset',user_id:'${s.user_id}',pin:p})">Reset PIN</button><button class="b s" onclick="confirm('Remove access?')&&fn({action:'remove',user_id:'${s.user_id}'})">Remove</button></td></tr>`).join('')}</table></div>`}
async function aud(){const{data}=await sb.from('audit').select('*').order('id',{ascending:false}).limit(200);$('pg').innerHTML=`<div class="c"><table>${data.map(a=>`<tr><td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.who)}</td><td>${esc(a.action)}</td></tr>`).join('')}</table></div>`}
const rpc=async(f,a)=>{const{error}=await sb.rpc(f,a);error?fail(error):show()};
async function ed(id){const m=MEM.find(x=>x.id==id),n=prompt('Full name',m.name);if(n===null)return;const p=prompt('Phone number (needed for login)',m.phone||'');if(p===null)return;rpc('edit_member',{mid:id,n,p:p.trim()?norm(p):null})}
const bl=l=>{let d=0,i=0,r=0;(l.loan_entries||[]).forEach(e=>e.k=='disb'?d+=e.amt:e.k=='int'?i+=e.amt:r+=e.amt);return d+i-r};
const LS={gua:'Awaiting guarantors',tre:'Awaiting Treasurer',pend:'Awaiting Admin',ok:'Active',rej:'Rejected'};let LC=[];
const opt=(D)=>'<option value="">Guarantor…</option>'+D.filter(x=>x.id!=me.member_id).map(x=>`<option value="${x.id}">${x.acct} · ${esc(x.name)}</option>`).join('');
async function lns(){const[{data:L},{data:D}]=await Promise.all([sb.from('loans').select('*,loan_guarantors(*),loan_entries(*)').order('id',{ascending:false}),sb.rpc('member_directory')]);LC=L;const mine=me.member_id,G=L.filter(l=>l.status=='gua'&&l.loan_guarantors.some(g=>g.member_id==mine&&g.s=='wait'));
 $('pg').innerHTML=lstats(L)+(mine?`<div class="c"><b>Request a loan</b> (24% p.a. added upfront, up to 75% of your savings, two guarantors)<br><input id="la" type="number" placeholder="Amount"><input id="lt" type="number" value="6" title="Months"><input id="lp" placeholder="Purpose"><select id="g1">${opt(D)}</select><select id="g2">${opt(D)}</select><button class="b" onclick="rpc('request_loan',{a:+$('la').value,t:+$('lt').value,p:$('lp').value,g1:$('g1').value||null,g2:$('g2').value||null})">Send request</button></div>`:'')
 +G.map(l=>`<div class="c"><b>Guarantee request</b>: ${esc(l.mname)} (${l.acct}) asks you to guarantee ${fm(l.amt)} over ${l.term} months for ${esc(l.purpose)}.<br><button class="b" onclick="rpc('guarantee',{lid:${l.id},agree:true})">I agree</button><button class="b s" onclick="rpc('guarantee',{lid:${l.id},agree:false})">Decline</button></div>`).join('')
 +`<div class="c"><table><tr><th>Loan</th><th>Member</th><th>Amount</th><th>Term</th><th>Status</th><th>Balance</th><th></th></tr>${L.map(l=>{const b=l.status=='ok'?bl(l):0,B=(t,f,a)=>`<button class="b${t?'':' s'}" onclick="${f}">${a}</button>`;return`<tr><td>${l.no||'—'}</td><td>${l.acct} ${esc(l.mname)}</td><td>${fm(l.amt)}</td><td>${l.term} mo</td><td>${l.status=='ok'&&!b?'Cleared':LS[l.status]}${l.why?'<br><small>'+esc(l.why)+'</small>':''}</td><td>${l.status=='ok'?fm(b):'—'}</td><td>${
  l.status=='tre'&&can('treasurer')?B(1,`rpc('advance_loan',{lid:${l.id},ok:true})`,'Advance')+B(0,`rpc('advance_loan',{lid:${l.id},ok:false})`,'Reject'):''}${
  l.status=='pend'&&can('admin')?B(1,`rpc('approve_loan',{lid:${l.id},ok:true})`,'Approve')+B(0,`rpc('approve_loan',{lid:${l.id},ok:false})`,'Reject'):''}${
  l.status=='ok'&&b>0&&can('treasurer')?B(1,`rep(${l.id})`,'Repayment'):''}${l.status=='ok'?B(0,`led(${l.id})`,'Ledger'):''}${
  l.status!='ok'&&can('admin')?B(0,`confirm('Delete this application?')&&rpc('delete_loan',{lid:${l.id}})`,'Delete'):''}</td></tr>`}).join('')}</table></div>`}
function rep(id){const a=prompt('Repayment amount (USh)');a&&rpc('record_repayment',{lid:id,a:+a,meth:'Mobile Money'})}
function led(id){const l=LC.find(x=>x.id==id);let r=0;alert(l.no+' '+l.mname+'\n'+(l.loan_entries||[]).sort((a,b)=>a.id-b.id).map(e=>{r+=e.k=='rep'?-e.amt:e.amt;return e.on_date+'  '+({disb:'Loan advanced',int:'Interest',rep:'Repayment'})[e.k]+'  '+fm(e.amt)+'  balance '+fm(r)}).join('\n'))}
const pill=m=>m.status=='Inactive'?'<small>Inactive</small>':m.arrears?`<small class="err">Arrears ${fm(m.arrears)}</small>`:m.advance?`<small>Advance ${fm(m.advance)}</small>`:'<small>Up to date</small>';
const st=(a,b)=>`<div style="flex:1;min-width:140px"><small>${a}</small><br><b style="font-size:18px">${b}</b></div>`;
const addMo=(d,n)=>{const x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};
let PID=null;const openM=id=>{PID=id;tab='prof';show()};
async function ov(){const{data:S}=await sb.from('member_summary').select('*').order('seq');let f='';
 if(can('admin','treasurer','auditor')){const[{data:G},{data:LE}]=await Promise.all([sb.from('gwds').select('amt').eq('status','ok'),sb.from('loan_entries').select('k,amt')]);
  f=st('Group fund',fm(S.reduce((a,m)=>a+m.sav,0)-G.reduce((a,g)=>a+g.amt,0)-LE.reduce((a,e)=>a+(e.k=='disb'?e.amt:e.k=='rep'?-e.amt:0),0)))}
 const A=S.filter(m=>m.arrears>0).sort((a,b)=>b.arrears-a.arrears);
 $('pg').innerHTML=`<div class="c" style="display:flex;gap:10px;flex-wrap:wrap">${st('Active members',S.filter(m=>m.status=='Active').length)}${can('admin','treasurer','auditor')?st('Total savings',fm(S.reduce((a,m)=>a+m.sav,0)))+f:''}${st('Members in arrears',A.length)}${st('Total arrears',fm(A.reduce((a,m)=>a+m.arrears,0)))}</div><div class="c"><b>Needs attention</b><table>${A.map(m=>`<tr><td>${m.acct}</td><td>${esc(m.name)}</td><td class="err">${fm(m.arrears)}</td><td><a href="#" onclick="openM('${m.id}');return false">Open</a></td></tr>`).join('')||'<tr><td>No arrears</td></tr>'}</table></div>`}
async function mem(){const{data}=await sb.from('member_summary').select('*').order('seq');MEM=data;
 $('pg').innerHTML=(can('admin','secretary')?`<div class="c"><b>Add member</b><br><input id="n" placeholder="Full name"><input id="p" placeholder="Phone"><input id="nin" placeholder="NIN"><input id="dob" type="date"><select id="g"><option>Female</option><option>Male</option></select><button class="b" onclick="addM()">Save</button></div>`:'')+`<div class="c"><input id="q" placeholder="Search…" oninput="[...document.querySelectorAll('#mt tr')].forEach((r,i)=>i&&(r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'))"><table id="mt"><tr><th>Account</th><th>Name</th><th>Phone</th><th>Status</th><th></th></tr>${data.map(m=>`<tr><td>${m.acct}</td><td>${esc(m.name)}</td><td>${esc(m.phone||'—')}</td><td>${can('admin','treasurer','auditor')?pill(m):m.status}</td><td><a href="#" onclick="openM('${m.id}');return false">Open</a>${can('admin','secretary')?` · <a href="#" onclick="ed('${m.id}');return false">Edit</a>`:''}</td></tr>`).join('')}</table></div>`}
async function prof(id){const[{data:m},{data:E},{data:L}]=await Promise.all([sb.from('member_summary').select('*').eq('id',id).single(),sb.from('entries').select('*').eq('member_id',id).order('id'),sb.from('loans').select('*,loan_entries(*)').eq('member_id',id)]);let r=0;const money=can('admin','treasurer','auditor','member');
 $('pg').innerHTML=`<div class="c"><h2>${m.acct} · ${esc(m.name)} ${money?pill(m):''}</h2><p>Phone ${esc(m.phone||'—')} · NIN ${esc(m.nin||'—')} · DOB ${m.dob||'—'} · ${esc(m.gender||'')} · Joined ${m.joined} · ${m.status}</p>${can('admin','secretary')?`<button class="b s" onclick="ed('${m.id}')">Edit</button>`:''}${can('admin')?`<button class="b s" onclick="rpc('set_status',{mid:'${m.id}',st:'${m.status=='Active'?'Inactive':'Active'}'})">${m.status=='Active'?'Deactivate':'Reactivate'}</button>`:''}${can('admin','treasurer')&&m.status=='Active'?`<button class="b" onclick="payP('${m.id}')">+ Payment</button>`:''}${can('treasurer')?`<button class="b" onclick="wdP('${m.id}')">Withdraw savings</button>`:''}</div>`
 +(money?`<div class="c"><b>Ledger</b> · savings ${fm(m.sav)}<table><tr><th>Date</th><th>Ref</th><th>Description</th><th>Status</th><th>Credit</th><th>Debit</th><th>Balance</th><th></th></tr>${E.map(e=>{if(e.status=='ok')r+=e.amt;return`<tr><td>${e.paid_on}</td><td>${e.receipt||'—'}</td><td>${({pay:'Payment · '+e.month,wd:'Withdrawal',rev:'Reversal'})[e.kind]}${e.reason?'<br><small>'+esc(e.reason)+'</small>':''}</td><td>${e.status}${e.reversed?' (reversed)':''}</td><td>${e.amt>0?fm(e.amt):''}</td><td>${e.amt<0?fm(-e.amt):''}</td><td>${e.status=='ok'?fm(r):'—'}</td><td>${e.status=='ok'&&!e.reversed&&e.kind!='rev'&&can('admin','treasurer')?`<a href="#" onclick="revP(${e.id});return false">Reverse</a>`:''}</td></tr>`}).join('')}</table></div>`:'')
 +(L.length&&money?`<div class="c"><b>Loans</b><table>${L.map(l=>{const f=k=>l.loan_entries.filter(e=>e.k==k).reduce((s,e)=>s+e.amt,0);return`<tr><td>${l.no||'—'}</td><td>${fm(l.amt)} · ${l.term} mo</td><td>${LS[l.status]}</td><td>${l.status=='ok'?fm(f('disb')+f('int')-f('rep')):''}</td></tr>`}).join('')}</table></div>`:'')}
function payP(id){const mon=prompt('Month (YYYY-MM)',new Date().toISOString().slice(0,7));if(!mon)return;const a=prompt('Amount (USh)','5000');a&&rpc('record_payment',{mid:id,mon,a:+a,meth:'Mobile Money'})}
function wdP(id){const a=prompt('Withdrawal amount (USh)');if(!a)return;const why=prompt('Reason (required)');why&&rpc('request_withdrawal',{mid:id,a:+a,meth:'Mobile Money',why})}
function revP(id){const why=prompt('Reason for reversal (required)');why&&rpc('request_reversal',{eid:id,why})}
async function appr(){const[{data:E},{data:G}]=await Promise.all([sb.from('entries').select('*,members(acct,name)').eq('status','pend').order('id'),sb.from('gwds').select('*').eq('status','pend').order('id')]);
 $('pg').innerHTML=`<div class="c">${can('treasurer')?`<button class="b" onclick="const a=prompt('Amount (USh)');const w=a&&prompt('Reason (required)');w&&rpc('request_group_withdrawal',{a:+a,meth:'Mobile Money',why:w})">General withdrawal</button>`:''}<p class="mut">Nobody approves their own entry. Withdrawals are approved by the Admin only.</p><table><tr><th>Type</th><th>Account</th><th>Amount</th><th></th></tr>${E.map(e=>`<tr><td>${({pay:'Payment · '+e.month,wd:'Withdrawal',rev:'Reversal'})[e.kind]}${e.reason?'<br><small>'+esc(e.reason)+'</small>':''}</td><td>${e.members.acct} ${esc(e.members.name)}</td><td>${fm(Math.abs(e.amt))}</td><td><button class="b" onclick="dec(${e.id},true)">Approve</button><button class="b s" onclick="dec(${e.id},false)">Reject</button></td></tr>`).join('')}${G.map(g=>`<tr><td>General withdrawal<br><small>${esc(g.reason)}</small></td><td>Group fund</td><td>${fm(g.amt)}</td><td>${can('admin')?`<button class="b" onclick="rpc('decide_gwd',{gid:${g.id},ok:true})">Approve</button><button class="b s" onclick="rpc('decide_gwd',{gid:${g.id},ok:false})">Reject</button>`:'Admin approves'}</td></tr>`).join('')}${E.length+G.length?'':'<tr><td>Nothing waiting</td></tr>'}</table></div>`}
let RT='arr',RH=[],RR=[];
async function reps(){const[{data:S},{data:E},{data:G},{data:L}]=await Promise.all([sb.from('member_summary').select('*').order('seq'),sb.from('entries').select('*,members(acct,name)').eq('status','ok').order('id'),sb.from('gwds').select('*').eq('status','ok'),sb.from('loans').select('*,loan_entries(*)').eq('status','ok')]);const today=new Date().toISOString().slice(0,10);
 if(RT=='arr'){RH=['Account','Member','Months owed','Arrears (USh)'];RR=S.filter(m=>m.arrears>0).sort((a,b)=>b.arrears-a.arrears).map(m=>[m.acct,m.name,m.arrears/5000,m.arrears])}
 else if(RT=='sav'){const t={};E.filter(e=>e.kind=='pay').forEach(e=>t[e.month]=(t[e.month]||0)+e.amt);RH=['Month','Collected (USh)'];RR=Object.keys(t).sort().map(k=>[k,t[k]])}
 else if(RT=='wd'){RH=['Date','Ref','Paid from','Reason','Amount (USh)'];RR=[...E.filter(e=>e.kind=='wd').map(e=>[e.paid_on,e.receipt,e.members.acct+' '+e.members.name,e.reason,-e.amt]),...G.map(g=>[g.created.slice(0,10),g.voucher,'Group fund',g.reason,g.amt])]}
 else{RH=['Loan','Member','Advanced','Interest','Repaid','Balance','Due','Status'];RR=L.map(l=>{const f=k=>l.loan_entries.filter(e=>e.k==k).reduce((s,e)=>s+e.amt,0),b=f('disb')+f('int')-f('rep'),due=addMo(l.approved_on,l.term);return[l.no,l.acct+' '+l.mname,f('disb'),f('int'),f('rep'),b,due,!b?'Cleared':due<today?'Overdue':'Active']})}
 $('pg').innerHTML=`<div class="c"><select onchange="RT=this.value;show()">${[['arr','Arrears'],['sav','Collections by month'],['wd','Withdrawals'],['loans','Loans']].map(o=>`<option value="${o[0]}" ${o[0]==RT?'selected':''}>${o[1]}</option>`).join('')}</select><button class="b s" onclick="csv()">Download CSV</button><table><tr>${RH.map(h=>`<th>${h}</th>`).join('')}</tr>${RR.map(r=>`<tr>${r.map(c=>`<td>${typeof c=='number'?c.toLocaleString():esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>No data</td></tr>'}</table></div>`}
function csv(){const t=[RH,...RR].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='report-'+RT+'.csv';a.click()}
const acat=t=>/^Signed in/.test(t)?'Sign-in':/loan/i.test(t)?'Loans':/withdrawal/i.test(t)?'Withdrawals':/^Requested reversal/.test(t)?'Reversals':/^Recorded payment/.test(t)?'Payments':/^(Approved|Rejected) entry/.test(t)?'Approvals':/^(Added|Edited|Deactivated|Reactivated)/.test(t)?'Member records':/^(Changed role|Gave|Removed access|Reset PIN)/.test(t)?'Users & settings':/^Imported/.test(t)?'Imports':'Other';
let AD=[],AF={u:'all',c:'all',q:''};
async function aud(){const{data}=await sb.from('audit').select('*').order('id',{ascending:false}).limit(1000);AD=data;audV()}
function audV(){const us=[...new Set(AD.map(a=>a.who))].sort(),cs=[...new Set(AD.map(a=>acat(a.action)))].sort(),o=(v,l,c)=>`<option value="${esc(v)}" ${c?'selected':''}>${esc(l)}</option>`,L=AD.filter(a=>(AF.u=='all'||a.who==AF.u)&&(AF.c=='all'||acat(a.action)==AF.c)&&(!AF.q||(a.action+' '+a.who).toLowerCase().includes(AF.q.toLowerCase())));
 $('pg').innerHTML=`<div class="c"><select onchange="AF.u=this.value;audV()">${o('all','All users',AF.u=='all')}${us.map(u=>o(u,u,AF.u==u)).join('')}</select><select onchange="AF.c=this.value;audV()">${o('all','All categories',AF.c=='all')}${cs.map(c=>o(c,c,AF.c==c)).join('')}</select><input placeholder="Search…" value="${esc(AF.q)}" onchange="AF.q=this.value;audV()"><button class="b s" onclick="AF={u:'all',c:'all',q:''};audV()">Clear</button><p>${L.length} entries</p><table>${L.map(a=>`<tr><td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.who)}</td><td>${acat(a.action)}</td><td>${esc(a.action)}</td></tr>`).join('')}</table></div>`}
const lstats=L=>{let p=0,i=0,n=0;L.filter(l=>l.status=='ok').forEach(l=>{const f=k=>l.loan_entries.filter(e=>e.k==k).reduce((s,e)=>s+e.amt,0),d=f('disb'),it=f('int'),r=f('rep'),pr=d-Math.max(0,r-it);p+=pr;i+=d+it-r-pr;if(d+it-r>0)n++});return `<div class="c" style="display:flex;gap:10px;flex-wrap:wrap">${st('Principal outstanding',fm(p))}${st('Interest owed',fm(i))}${st('Active loans',n)}${st('Awaiting action',L.filter(l=>['tre','pend'].includes(l.status)).length)}</div>`};

boot();
</script></body></html>
